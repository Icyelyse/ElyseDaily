<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旅遊記帳系統</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" />
<meta name="theme-color" content="#7B93A8" />
<link rel="stylesheet" href="/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<header class="topbar">
  <h1 id="guestTripName">✈️ 旅遊記帳系統</h1>
  <div class="trip-picker">
    <span id="offlineBadge" class="offline-badge hidden">📴 離線，<span id="offlineCount">0</span> 筆待同步</span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="record">記帳</button>
  <button class="tab-btn" data-tab="dashboard">總覽圖表</button>
  <button class="tab-btn" data-tab="settlement">分帳結算</button>
</nav>

<main id="app">
  <p id="noTripHint" class="hint"></p>

  <!-- 記帳 -->
  <section id="tab-record" class="tab-panel active">
    <form id="expenseForm" class="card">
      <input type="hidden" id="expenseId" />
      <h2 id="formTitle">新增支出</h2>
      <div class="form-grid">
        <label>日期
          <input type="date" id="f-date" required />
        </label>
        <label>分類
          <select id="f-category"></select>
        </label>
        <label>付款人
          <select id="f-payer"></select>
        </label>
        <label>付款金額
          <input type="number" id="f-amount" step="0.01" min="0" required />
        </label>
        <label>付款幣別
          <select id="f-currency"></select>
        </label>
        <label>TWD匯率（自動帶入，可手動修改）
          <input type="number" id="f-rate" step="any" min="0" required />
        </label>
        <label>付款方式
          <select id="f-payment">
            <option value="cash">現金</option>
            <option value="credit_card">信用卡</option>
          </select>
        </label>
      </div>
      <p id="rateStatus" class="rate-status"></p>
      <p class="converted-preview">換算金額：<strong id="convertedPreview">-</strong> TWD</p>

      <div class="split-block">
        <label>分攤方式</label>
        <div class="split-mode">
          <label><input type="radio" name="splitMode" value="none" /> 無需分攤</label>
          <label><input type="radio" name="splitMode" value="equal" checked /> 全體成員均分</label>
          <label><input type="radio" name="splitMode" value="custom" /> 自訂分攤金額</label>
        </div>
        <div id="splitCustomArea" class="split-custom hidden"></div>
      </div>

      <label class="note-label">備註
        <input type="text" id="f-note" placeholder="選填" />
      </label>

      <label class="note-label">收據照片（選填）
        <input type="file" id="f-receipt" accept="image/*" />
      </label>
      <div id="receiptPreview" class="receipt-preview hidden">
        <img id="receiptImg" alt="收據預覽" />
        <button type="button" id="removeReceiptBtn" class="btn btn-danger btn-small">移除收據</button>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">儲存</button>
        <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">取消編輯</button>
      </div>
    </form>

    <div class="card">
      <h2>最近的支出</h2>
      <div id="recentExpenses"></div>
    </div>
  </section>

  <!-- 總覽圖表 -->
  <section id="tab-dashboard" class="tab-panel">
    <div class="card filter-bar">
      <label>從 <input type="date" id="filterFrom" /></label>
      <label>到 <input type="date" id="filterTo" /></label>
      <button id="clearFilterBtn" class="btn btn-secondary">清除篩選</button>
      <a id="exportCsvBtn" class="btn btn-secondary" href="#" download>匯出 CSV</a>
    </div>
    <div class="card total-card">
      <div>總花費</div>
      <div id="totalAmount" class="total-amount">-</div>
    </div>
    <div class="charts-grid">
      <div class="card"><h3>依分類</h3><canvas id="categoryChart"></canvas></div>
      <div class="card"><h3>每日花費趨勢</h3><canvas id="dateChart"></canvas></div>
      <div class="card"><h3>依成員支付金額</h3><canvas id="memberChart"></canvas></div>
    </div>
  </section>

  <!-- 分帳結算 -->
  <section id="tab-settlement" class="tab-panel">
    <div class="card">
      <h2>成員收支</h2>
      <table id="balanceTable">
        <thead><tr><th>成員</th><th>已付</th><th>應分攤</th><th>淨額</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h2>建議轉帳</h2>
      <ul id="transactionList" class="transaction-list"></ul>
    </div>
    <div class="card">
      <h2>支出明細</h2>
      <p class="hint">列出這趟旅程所有輸入的支出，不論分攤方式，方便對照上面的結算結果。</p>
      <div class="table-wrap">
        <table id="expenseDetailTable">
          <thead><tr><th>日期</th><th>付款人</th><th>付款方式</th><th>金額(TWD)</th><th>分攤方式</th><th>分攤明細</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<div id="modalRoot"></div>

<script src="/app.js"></script>
</body>
</html>
